# Demonstrate error isolation, dead-letter routing, and idempotency.
#
# Strategy:
#   1. Use `try` to short-circuit a sub-pipeline on the first error.
#   2. Use `catch` to attach the error reason to the message.
#   3. At the output, branch on `errored()` to send bad messages to a DLQ.
#   4. Use `dedupe` (cache-backed) to make replays safe.

input:
  file:
    paths: [ ./examples/09-error-handling-dlq/data/orders.jsonl ]
    codec: lines

cache_resources:
  - label: dedupe_cache
    memory:
      default_ttl: 1h

pipeline:
  processors:

    # Skip messages we've already processed (idempotency on order_id).
    # If the JSON is malformed `order_id` is unset, the dedupe key is empty,
    # and the message proceeds to the validation step which will flag it.
    - dedupe:
        cache: dedupe_cache
        key: ${! json("order_id").or("") }

    # Risky steps wrapped in `try` — first error short-circuits the rest.
    - try:
        - mapping: |
            # Re-parse to surface JSON errors here, not silently downstream.
            root = content().parse_json()

        - mapping: |
            # Validate required fields, throw to flag with a useful message.
            if this.order_id == null { throw("missing order_id") }
            if this.sku      == null { throw("missing sku") }
            if this.qty      == null || this.qty <= 0 {
              throw("qty must be > 0, got %v".format(this.qty))
            }
            if this.price    == null || this.price < 0 {
              throw("price must be >= 0, got %v".format(this.price))
            }
            root = this
            root.total = this.qty * this.price

    # `catch` only runs for messages that errored anywhere above.
    - catch:
        - mapping: |
            root.original    = content().string()
            root.error       = error()
            root.failed_at   = now()
            meta dlq         = "true"

output:
  switch:
    cases:
      # Errored / DLQ branch — `errored()` is true if any processor flagged the message.
      - check: errored() || meta("dlq") == "true"
        output:
          file:
            path:  ./examples/09-error-handling-dlq/out/dlq.jsonl
            codec: lines
      # Happy path.
      - output:
          file:
            path:  ./examples/09-error-handling-dlq/out/processed.jsonl
            codec: lines
