# Read a CSV file, coerce types, append `processed_at`, write JSON-Lines.
#
#   csv ----> mapping ----> file (lines codec)

input:
  csv:
    paths:
      - ./data/orders.csv
    parse_header_row: true   # treat the first row as field names
    delimiter: ","

pipeline:
  processors:
    # Coerce types (CSV gives us strings) and stamp a processing time.
    - mapping: |
        root.order_id     = this.order_id.number()
        root.customer     = this.customer
        root.amount       = this.amount.number()
        root.paid         = this.paid.bool()
        root.processed_at = now()

output:
  file:
    path: ./out/orders.jsonl
    codec: lines           # one JSON object per line
