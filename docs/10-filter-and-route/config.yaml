# Same input, three output sinks routed by message content.
#
# Reuses the data file from example 04 — make sure you've run that one first
# (or just point the path elsewhere).

input:
  file:
    paths:
      - ./data/events.jsonl
    codec: lines

pipeline:
  processors:
    # Normalise items.length() == 0 events out and compute total + tier.
    - mapping: |
        root = if this.items.length() == 0 { deleted() } else { this }
        root.total = this.items.map_each(i -> i.qty * i.price).sum()
        root.tier  = match {
          root.total >= 200 => "gold",
          root.total >= 50  => "silver",
          _                 => "bronze",
        }

    # Per-tier processing using the SWITCH PROCESSOR.
    - switch:
        - check: this.tier == "gold"
          processors:
            - mapping: 'meta priority = "high"'
        - check: this.tier == "silver"
          processors:
            - mapping: 'meta priority = "normal"'
        - processors:                       # default branch (no `check`)
            - mapping: 'meta priority = "low"'

# Per-tier sinks using the SWITCH OUTPUT.
output:
  switch:
    cases:
      - check: this.tier == "gold"
        output:
          file:
            path:  ./out/gold.jsonl
            codec: lines
      - check: this.tier == "silver"
        output:
          file:
            path:  ./out/silver.jsonl
            codec: lines
      - output:                               # default — bronze
          file:
            path:  ./out/bronze.jsonl
            codec: lines
